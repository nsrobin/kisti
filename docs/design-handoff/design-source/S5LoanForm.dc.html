<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Add or edit loan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,100..800&amp;family=Anek+Latin:wdth,wght@75..125,100..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: {{minH}}; height: {{H}}; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.base}}; color: {{t.tp}}; font-family: {{f}}; display: flex; flex-direction: column">
  <main style="flex: 1 0 auto; padding: 44px 20px 150px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; gap: 4px; margin: 0 -8px">
      <a href="S4Loans.dc.html" aria-label="{{s.close}}" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: {{t.tp}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6 6 18"></path></svg></a>
      <h1 style="margin: 0; font-size: {{ty.tiS}}px; line-height: {{ty.ti}}; font-weight: 600">{{title}}</h1>
    </header>

    <sc-for list="{{textFields}}" as="fd" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="{{fd.id}}" style="font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.ts}}">{{fd.label}}</label>
        <div style="height: 52px; border-radius: 14px; background: {{t.sunken}}; border: 1px solid {{t.line}}; box-shadow: {{fd.ring}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box">
          <sc-if value="{{fd.icon}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{fd.ic}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{fd.icon}}"></path></svg></sc-if>
          <span style="font-size: 17px; color: {{t.ts}}; font-weight: 600">{{fd.pre}}</span>
          <input id="{{fd.id}}" inputmode="{{fd.mode}}" value="{{fd.val}}" placeholder="{{fd.ph}}" onChange="{{fd.on}}" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; color: {{t.tp}}; font-family: inherit; font-size: 17px; font-weight: {{fd.fw}}; font-variant-numeric: tabular-nums; padding: 0">
          <span style="font-size: 17px; color: {{t.ts}}; font-weight: 600">{{fd.suf}}</span>
        </div>
        <sc-if value="{{fd.err}}" hint-placeholder-val="{{ false }}">
          <span role="alert" style="display: flex; gap: 6px; align-items: center; font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.err}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.err}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.warning}}"></path></svg>{{fd.err}}</span>
        </sc-if>
        <sc-if value="{{fd.chips}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 2px">
            <span style="font-size: 13px; line-height: 1.45; font-weight: 500; color: {{t.tm}}">{{s.recentBanks}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{fd.chips}}" as="ch" hint-placeholder-count="3">
                <button type="button" onClick="{{ch.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.raised}}; color: {{t.tp}}; font-family: inherit; font-size: {{ty.caS}}px; font-weight: 500; cursor: pointer">{{ch.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="fDur" style="font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.ts}}">{{s.loanDuration}}</span>
      <div role="group" aria-labelledby="fDur" style="display: flex; gap: 10px; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; height: 52px; border-radius: 14px; background: {{t.sunken}}; border: 1px solid {{t.line}}; box-sizing: border-box; padding: 0 2px">
          <button type="button" aria-label="−" onClick="{{durDown}}" style="width: 48px; height: 48px; border: 0; background: transparent; color: {{t.tp}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span style="min-width: 60px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{durVal}}</span>
          <button type="button" aria-label="+" onClick="{{durUp}}" style="width: 48px; height: 48px; border: 0; background: transparent; color: {{t.tp}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
        </div>
        <div style="display: flex; padding: 3px; border-radius: 999px; background: {{t.sunken}}; border: 1px solid {{t.line}}">
          <sc-for list="{{units}}" as="u" hint-placeholder-count="2">
            <button type="button" onClick="{{u.pick}}" aria-pressed="{{u.on}}" style="min-width: 60px; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 0; background: {{u.bg}}; color: {{u.c}}; font-family: inherit; font-size: {{ty.boS}}px; font-weight: 600; cursor: pointer">{{u.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="fMonth" style="font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.ts}}">{{s.formFirstMonth}}</span>
      <button type="button" aria-labelledby="fMonth" onClick="{{openPicker}}" style="height: 52px; border-radius: 14px; background: {{t.sunken}}; border: 1px solid {{t.line}}; box-shadow: {{monthRing}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: {{monthC}}; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.pri}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.calendar}}"></path></svg>
        <span style="flex: 1 1 auto">{{monthTxt}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.ts}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
      <sc-if value="{{monthErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="display: flex; gap: 6px; align-items: center; font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.err}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.err}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.warning}}"></path></svg>{{monthErr}}</span></sc-if>
    </div>

    <section style="border-radius: 20px; background: {{t.raised}}; border: 1px solid {{t.line}}; box-shadow: {{t.sh}}; display: flex; flex-direction: column">
      <button type="button" onClick="{{toggleDed}}" aria-expanded="{{dedA}}" style="min-height: 60px; padding: 0 14px; border: 0; background: transparent; color: {{t.tp}}; font-family: inherit; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ded}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="{{ic.receipt}}"></path></svg>
        <span style="flex: 1 1 auto; font-size: {{ty.boS}}px; line-height: {{ty.bo}}; font-weight: 600">{{s.formAddDeductions}}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.ts}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{dedRot}}deg); flex: 0 0 auto"><path d="M5 9l7 7 7-7"></path></svg>
      </button>
      <sc-if value="{{dedOpen}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 0 14px 16px; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{dedFields}}" as="fd" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="{{fd.id}}" style="font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.ts}}">{{fd.label}}</label>
              <div style="height: 52px; border-radius: 14px; background: {{t.sunken}}; border: 1px solid {{t.line}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box">
                <span style="font-size: 17px; color: {{t.ts}}; font-weight: 600">৳</span>
                <input id="{{fd.id}}" inputmode="decimal" value="{{fd.val}}" placeholder="{{fd.ph}}" onChange="{{fd.on}}" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; color: {{t.tp}}; font-family: inherit; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0">
              </div>
            </div>
          </sc-for>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid {{t.line}}">
            <span style="font-size: {{ty.boS}}px; line-height: {{ty.bo}}; color: {{t.ts}}">{{s.dedNetCash}}</span>
            <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{netC}}; white-space: nowrap">{{netTxt}}</span>
          </div>
        </div>
      </sc-if>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="fCol" style="font-size: {{ty.caS}}px; line-height: {{ty.ca}}; font-weight: 500; color: {{t.ts}}">{{s.formColour}}</span>
      <div role="radiogroup" aria-labelledby="fCol" style="display: flex; gap: 12px">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{sw.on}}" aria-label="{{sw.name}}" onClick="{{sw.pick}}" style="width: 48px; height: 48px; border-radius: 999px; border: 3px solid {{sw.ring}}; background: {{sw.c}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-sizing: border-box">
            <sc-if value="{{sw.sel}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{sw.chk}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </main>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; background: {{t.glass}}; border-top: 1px solid {{t.line}}; padding: 12px 20px 26px; display: flex; align-items: center; gap: 12px">
    <div aria-live="polite" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 12px; line-height: 1.45; font-weight: 500; color: {{t.ts}}">{{s.bankEmi}}</span>
      <span style="font-size: 22px; line-height: 1.25; font-weight: 800; font-stretch: 112.5%; font-variant-numeric: tabular-nums; color: {{prevC}}; white-space: nowrap">{{prevEmi}}</span>
      <span style="font-size: 12px; line-height: 1.45; font-weight: 500; color: {{t.ts}}; white-space: nowrap">{{prevLast}}</span>
    </div>
    <a href="{{saveHref}}" aria-disabled="{{saveDis}}" style="flex: 0 0 auto; min-height: 52px; padding: 0 20px; border-radius: 999px; background: {{saveBg}}; color: {{saveC}}; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: {{ty.boS}}px; font-weight: 700; pointer-events: {{savePe}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{s.formSave}}</a>
  </footer>

  <sc-if value="{{picker}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{closePicker}}" aria-label="{{s.close}}" style="position: absolute; inset: 0; width: 100%; border: 0; padding: 0; background: {{t.scrim}}; cursor: pointer"></button>
    <div role="dialog" aria-labelledby="pkTitle" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: {{t.raised}}; border-top: 1px solid {{t.line}}; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(8,6,24,0.3)">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: {{t.line}}"></span>
      <h2 id="pkTitle" style="margin: 0; font-size: {{ty.seS}}px; line-height: {{ty.se}}; font-weight: 600">{{s.formFirstMonth}}</h2>
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px">
        <button type="button" aria-label="{{s.prevYear}}" onClick="{{pkPrev}}" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: {{t.base}}; color: {{t.tp}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="min-width: 96px; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; font-stretch: 112.5%; font-variant-numeric: tabular-nums">{{pkYear}}</span>
        <button type="button" aria-label="{{s.nextYear}}" onClick="{{pkNext}}" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: {{t.base}}; color: {{t.tp}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div role="grid" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{pkCells}}" as="pc" hint-placeholder-count="12">
          <button type="button" onClick="{{pc.pick}}" disabled="{{pc.dis}}" aria-pressed="{{pc.on}}" aria-label="{{pc.aria}}" style="height: 56px; border-radius: 16px; border: 1px solid {{pc.bd}}; background: {{pc.bg}}; color: {{pc.c}}; opacity: {{pc.op}}; font-family: inherit; font-size: {{ty.boS}}px; font-weight: {{pc.fw}}; cursor: pointer">{{pc.label}}</button>
        </sc-for>
      </div>
      <button type="button" onClick="{{closePicker}}" style="min-height: 52px; border-radius: 999px; border: 0; background: {{t.emi}}; color: {{t.onEmi}}; font-family: inherit; font-size: {{ty.boS}}px; font-weight: 700; cursor: pointer">{{s.done}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
