<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Choose your language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,100..800&amp;family=Anek+Latin:wdth,wght@75..125,100..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.base}}; color: {{t.tp}}; font-family: 'Anek Bangla','Anek Latin',sans-serif; display: flex; flex-direction: column; padding: 72px 20px 34px; gap: 28px">
  <div style="display: flex; align-items: center; gap: 12px">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <defs><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{t.a1}}"></stop><stop offset="0.52" stop-color="{{t.a2}}"></stop><stop offset="1" stop-color="{{t.a3}}"></stop></linearGradient></defs>
      <circle cx="22" cy="22" r="18" fill="none" stroke="url(#lgA)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="3.6 5.8"></circle>
      <text x="22" y="29" text-anchor="middle" font-family="Anek Bangla, sans-serif" font-size="19" font-weight="800" fill="{{t.tp}}">৳</text>
    </svg>
    <span style="font-size: 30px; line-height: 1.3; font-weight: 800; font-stretch: 125%">কিস্তি</span>
    <span style="font-family: 'Anek Latin',sans-serif; font-size: 20px; line-height: 1.1; font-weight: 800; font-stretch: 125%; color: {{t.ts}}">Kisti</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.45; font-weight: 700">ভাষা বেছে নিন</h1>
    <p lang="en" style="margin: 0; font-family: 'Anek Latin',sans-serif; font-size: 20px; line-height: 1.3; font-weight: 500; color: {{t.ts}}">Choose your language</p>
  </div>
  <div role="radiogroup" aria-label="ভাষা বেছে নিন / Choose your language" style="display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
      <button type="button" role="radio" aria-checked="{{c.on}}" lang="{{c.lang}}" onClick="{{c.pick}}" style="min-height: 132px; border-radius: 28px; border: {{c.bd}}; background: {{c.bg}}; box-shadow: {{c.sh}}; color: {{t.tp}}; font-family: {{c.font}}; padding: 20px 22px; display: flex; align-items: center; gap: 16px; text-align: left; cursor: pointer; box-sizing: border-box">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 44px; line-height: {{c.lh}}; font-weight: 800; font-stretch: 125%">{{c.name}}</span>
          <span style="font-size: 15px; line-height: 1.5; font-weight: 500; color: {{t.ts}}">{{c.sample}}</span>
        </span>
        <span style="width: 32px; height: 32px; border-radius: 999px; border: {{c.rbd}}; background: {{c.rbg}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; box-sizing: border-box">
          <sc-if value="{{c.sel}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.onEmi}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        </span>
      </button>
    </sc-for>
  </div>
  <p style="margin: 0; font-size: 14px; line-height: 1.55; color: {{t.tm}}">পরে সেটিংস থেকে বদলাতে পারবেন। <span lang="en" style="font-family: 'Anek Latin',sans-serif">You can change this later in Settings.</span></p>
  <div style="flex: 1 1 auto"></div>
  <a href="{{next}}" aria-disabled="{{dis}}" style="min-height: 56px; border-radius: 999px; background: {{btnBg}}; color: {{btnC}}; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; pointer-events: {{pe}}">ঠিক আছে  <span lang="en" style="font-family: 'Anek Latin',sans-serif; font-weight: 600; opacity: 0.85; margin-left: 8px">Done</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"picked":{"editor":"enum","options":["none","bn","en"],"default":"none"},"$preview":{"width":390,"height":844}}'>
var TOK={dark:{base:'#120F2E',raised:'#1B1744',line:'#2C2760',tp:'#F4F2FF',ts:'#B7B2E0',tm:'#8C86BC',emi:'#2EE6D0',a1:'#2EE6D0',a2:'#A78BFA',a3:'#FF5C9A',onEmi:'#120F2E',sh:'none',sel:'rgba(46,230,208,0.10)'},light:{base:'#F5F4FF',raised:'#FFFFFF',line:'#DDD9F5',tp:'#1A1640',ts:'#4B4680',tm:'#625E8F',emi:'#087A6F',a1:'#0FB5A3',a2:'#7C4DFF',a3:'#E83E8C',onEmi:'#FFFFFF',sh:'0 4px 16px rgba(46,32,140,0.10)',sel:'rgba(8,122,111,0.08)'}};
class Component extends DCLogic {
  constructor(p){super(p);this.state={};}
  renderVals() {
    var self=this,d=this.props.theme==='light'?'light':'dark',t=TOK[d];
    var picked=this.state.picked||(this.props.picked==='bn'||this.props.picked==='en'?this.props.picked:null);
    var cards=[['bn','বাংলা','লোন ও কিস্তি ক্যালকুলেটর',"'Anek Bangla',sans-serif",1.25],['en','English','Loan & EMI Calculator',"'Anek Latin',sans-serif",1.1]].map(function(x){var on=picked===x[0];return {lang:x[0],name:x[1],sample:x[2],font:x[3],lh:x[4],on:on?'true':'false',sel:on,bd:on?'2px solid '+t.emi:'1px solid '+t.line,bg:on?t.sel:t.raised,sh:t.sh,rbd:on?'0':'2px solid '+t.line,rbg:on?t.emi:'transparent',pick:function(){self.setState({picked:x[0]});}};});
    return {t:t,cards:cards,next:picked==='en'?'S3CalculatorEn.dc.html':(picked?'S3Calculator.dc.html':'#'),dis:picked?'false':'true',btnBg:picked?t.emi:t.line,btnC:picked?t.onEmi:t.tm,pe:picked?'auto':'none'};
  }
}
</script>
</body>
</html>
